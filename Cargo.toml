[package]
name = "tone-web-cf"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
wasm-bindgen-futures = "0.4.42"
js-sys = "0.3.69"

[dependencies.web-sys]
version = "0.3.69"
features = [
    "Window",
    "Document",
    "Navigator",
    "MediaDevices",
    "MediaDeviceInfo",
    "MediaDeviceKind",
    "MediaStreamConstraints",
    "AudioContext",
    "AudioContextOptions",
    "OscillatorNode",
    "OscillatorType",
    "GainNode",
    "AudioParam",
    "HtmlSelectElement",
    "HtmlInputElement",
    "HtmlButtonElement",
    "HtmlElement",
    "EventTarget",
]
