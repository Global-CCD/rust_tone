<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>440 Hz Reference Tone</title>
    <link data-trunk rel="copy-file" href="static/_headers" />
    <style>
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --accent: #38bdf8;
        --accent-hover: #0284c7;
        --danger: #ef4444;
        --border: #334155;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        background-color: var(--card);
        border: 1px solid var(--border);
        padding: 2rem;
        border-radius: 12px;
        width: 100%;
        max-width: 380px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      }
      h1 { font-size: 1.4rem; margin-top: 0; margin-bottom: 0.25rem; }
      p.subtitle { color: #94a3b8; font-size: 0.85rem; margin-top: 0; margin-bottom: 1.5rem; }
      label { display: block; font-size: 0.85rem; margin-bottom: 0.4rem; color: #cbd5e1; }
      select, input {
        width: 100%;
        padding: 0.6rem;
        margin-bottom: 1.2rem;
        background: #0f172a;
        color: #fff;
        border: 1px solid var(--border);
        border-radius: 6px;
        box-sizing: border-box;
      }
      .btn-group { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
      button {
        flex: 1;
        padding: 0.75rem;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.15s ease-in-out;
      }
      #play-btn { background-color: var(--accent); color: #0f172a; }
      #play-btn:hover { background-color: var(--accent-hover); }
      #play-btn.playing { background-color: var(--danger); color: #ffffff; }
      #perm-btn { background: #334155; color: #f8fafc; font-size: 0.75rem; padding: 0.4rem 0.6rem; margin-bottom: 1.2rem; }
      #status {
        text-align: center;
        font-size: 0.95rem;
        font-variant-numeric: tabular-nums;
        min-height: 1.5rem;
        color: #38bdf8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>440 Hz Reference Tone</h1>
      <p class="subtitle">Standard Concert Pitch (A4)</p>

      <label for="device-select">Audio Output Device:</label>
      <select id="device-select">
        <option value="default">Default System Output</option>
      </select>

      <button id="perm-btn">🔍 Scan & Reveal Device Names</button>

      <label for="duration-input">Playback Duration (Minutes):</label>
      <input type="number" id="duration-input" min="0.1" max="60" step="0.5" value="1.0" />

      <button id="play-btn">▶ Play Tone</button>

      <div id="status"></div>
    </div>
  </body>
</html>
